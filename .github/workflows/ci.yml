name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test

    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@12.4.2

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Web production build
        run: pnpm --filter @portfolio/web build

      - name: Validate public web deployment contract
        run: pnpm web:deployment:check

      - name: Unit tests
        run: pnpm test

      - name: First-admin bootstrap concurrency
        env:
          BOOTSTRAP_TEST_SERVER_URL: postgresql://postgres:postgres@localhost:5432
        run: bash scripts/deployment/test-bootstrap-first-admin.sh

      - name: Full lifecycle MVP release gate
        env:
          RECOVERY_USE_DOCKER_TOOLS: "1"
          RECOVERY_PG_IMAGE: postgres:17
          RECOVERY_SERVER_URL: postgresql://postgres:postgres@localhost:5432
          RELEASE_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm release:rehearse

      - name: Production backup restore rehearsal
        env:
          BACKUP_TEST_SERVER_URL: postgresql://postgres:postgres@localhost:5432
        run: bash scripts/recovery/test-production-backup.sh

      - name: Supabase Edge Function source check
        run: |
          deno check --config supabase/functions/api/deno.json supabase/functions/api/index.ts
          deno test --config supabase/functions/api/deno.json \
            supabase/functions/api/runtime-config.test.ts \
            supabase/functions/api/cors.test.ts \
            supabase/functions/api/host-routing.test.ts

      - name: Reject mismatched Supabase deployment SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          WRONG_SHA=0000000000000000000000000000000000000000
          if DEPLOY_CODE_SHA="$WRONG_SHA" pnpm supabase:function:bundle; then
            echo "Bundle accepted a mismatched deploy SHA." >&2
            exit 1
          fi

      - name: Reject dirty Supabase deployment source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '\n' >> supabase/functions/api/cors.ts
          if DEPLOY_CODE_SHA="$EXPECTED_SHA" pnpm supabase:function:bundle; then
            echo "Bundle accepted a dirty working tree." >&2
            git restore supabase/functions/api/cors.ts
            exit 1
          fi
          git restore supabase/functions/api/cors.ts
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prove syntax-aware Node built-in normalization
        run: |
          mkdir -p .artifacts/node-builtins
          cat > .artifacts/node-builtins/fixture.js <<'EOF'
          import { performance } from "perf_hooks";
          import path from "node:path";
          const fs = await import("fs/promises");
          const crypto = require("crypto");

          export const payloadA = 'provider error: require("crypto") failed';
          export const payloadB = 'from "fs"';
          export const payloadC = `import("fs/promises")`;

          console.log(performance.now() >= 0, path.sep.length > 0, !!fs, !!crypto);
          EOF

          BUILTIN_ALIAS_ARGS=()
          while IFS= read -r builtin; do
            if [[ -n "$builtin" ]]; then
              BUILTIN_ALIAS_ARGS+=("--alias:${builtin}=node:${builtin}")
            fi
          done < <(
            node --input-type=module -e '
              import { builtinModules } from "node:module";
              process.stdout.write(
                [...new Set(
                  builtinModules
                    .filter((name) => !name.startsWith("node:"))
                    .sort(),
                )].join("\n"),
              );
            '
          )

          pnpm dlx esbuild@0.28.2             .artifacts/node-builtins/fixture.js             --bundle             --format=esm             --platform=node             --target=es2022             "${BUILTIN_ALIAS_ARGS[@]}"             --outfile=.artifacts/node-builtins/out.js

          grep -Fq 'from "node:perf_hooks"' .artifacts/node-builtins/out.js
          grep -Fq '"node:fs/promises"' .artifacts/node-builtins/out.js
          grep -Fq '"node:crypto"' .artifacts/node-builtins/out.js
          grep -Fq 'from "node:path"' .artifacts/node-builtins/out.js

          grep -Fq 'provider error: require("crypto") failed' .artifacts/node-builtins/out.js
          grep -Fq 'from "fs"' .artifacts/node-builtins/out.js
          grep -Fq 'import("fs/promises")' .artifacts/node-builtins/out.js

      - name: Prove Node global injection
        run: |
          mkdir -p .artifacts/node-globals
          cat > .artifacts/node-globals/fixture.js <<'EOF'
          const bytes = Buffer.from("ok");
          const payload = 'setImmediate(() => "payload")';
          const timer = setImmediate(() => console.log(bytes.toString("utf8"), payload));
          clearImmediate(timer);
          setImmediate(() => console.log(bytes.toString("utf8"), payload));
          EOF

          pnpm dlx esbuild@0.28.2             .artifacts/node-globals/fixture.js             --bundle             --format=esm             --platform=node             --target=es2022             --inject:./scripts/deployment/esbuild-node-globals.ts             --outfile=.artifacts/node-globals/out.js

          grep -Fq 'node:buffer' .artifacts/node-globals/out.js
          grep -Fq 'node:timers' .artifacts/node-globals/out.js
          grep -Fq 'setImmediate(() => "payload")' .artifacts/node-globals/out.js
          deno run .artifacts/node-globals/out.js | grep -Fq 'ok setImmediate(() => "payload")'

      - name: Build deployable Supabase Edge bundle
        env:
          DEPLOY_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm supabase:function:bundle

      - name: Verify Supabase deployment provenance
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MANIFEST=.artifacts/deployment/supabase-api-manifest.txt
          test -f "$MANIFEST"
          test "$(awk -F= '$1 == "source_sha" { print $2 }' "$MANIFEST")" = "$EXPECTED_SHA"
          test "$(awk -F= '$1 == "bundle_sha256" { print $2 }' "$MANIFEST")" = "$(shasum -a 256 supabase/functions/api/dist/index.js | awk '{print $1}')"
          test "$(awk -F= '$1 == "bundle_bytes" { print $2 }' "$MANIFEST")" = "$(wc -c < supabase/functions/api/dist/index.js | tr -d ' ')"
          test "$(awk -F= '$1 == "esbuild_version" { print $2 }' "$MANIFEST")" = "0.28.2"
          grep -Fq "$EXPECTED_SHA" supabase/functions/api/dist/index.js
          ! grep -Fq "__PORTFOLIO_BUILD_SHA__" supabase/functions/api/dist/index.js
          ! grep -Fq "PORTFOLIO_RELEASE_SHA" supabase/functions/api/dist/index.js

      - name: Check deployable Supabase Edge bundle
        run: deno check supabase/functions/api/dist/index.js
